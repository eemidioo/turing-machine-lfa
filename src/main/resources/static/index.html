<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Máquina de Turing - AnBnCn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>TURING MACHINE SIMULATOR</h1>
        <h2>Linguagem: $L = \{a^n b^n c^n \mid n \ge 1\}$</h2>
    </header>

    <main class="main-container">
        <!-- Painel de Status -->
        <div class="status-panel">
            <div class="status-item">Estado: <span id="current-state" class="badge">q0</span></div>
            <div class="status-item">Passos: <span id="step-count">0</span></div>
            <div class="status-item">Status: <span id="machine-status" class="status-pending">Pronto</span></div>
        </div>

        <!-- Última transição aplicada -->
        <div class="transition-panel">
            Última transição: <span id="last-transition" class="transition-info">—</span>
        </div>

        <!-- Mensagens de erro -->
        <div id="error-message" class="error-message" role="alert" hidden></div>

        <!-- Fita Visual -->
        <div class="tape-container">
            <div id="head-pointer" class="head-pointer">▼</div>
            <div id="tape-track" class="tape-track">
                <!-- Células geradas via JavaScript -->
            </div>
        </div>

        <!-- Controles da Máquina -->
        <div class="controls-panel">
            <button id="btn-step" class="btn" disabled>Passo a Passo</button>
            <button id="btn-play" class="btn btn-primary" disabled>▶ Play</button>
            <button id="btn-pause" class="btn" disabled>⏸ Pause</button>
            <button id="btn-reset" class="btn">↺ Reset</button>
        </div>

        <!-- Configuração de Entrada -->
        <div class="input-panel">
            <label for="input-string">Cadeia de Entrada:</label>
            <input type="text" id="input-string" value="aabbcc" placeholder="Ex: aaabbbccc"
                   pattern="[abc]+" title="Use apenas os símbolos a, b e c">
            <button id="btn-load" class="btn btn-secondary">Carregar na Fita</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
